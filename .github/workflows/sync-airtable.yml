name: Sync Airtable to MongoDB

# =============================================================================
# Automated Airtable → MongoDB Sync Workflow
# =============================================================================
# Replaces Vercel cron job with more robust GitHub Actions workflow
#
# Features:
# - Scheduled daily sync (2 AM UTC)
# - Manual trigger via GitHub UI
# - Retry logic for transient failures
# - Comprehensive error handling
# - Audit logs stored as artifacts (30 days)
# - Platform-agnostic (works with any hosting provider)
#
# Dependency Order:
# 1. Countries - No dependencies
# 2. Districts (GAUL codes) - No dependencies
# 3. Taxa (FAO species codes) - No dependencies
# 4. Surveys (forms) - No dependencies
# 5. Users - Depends on districts + surveys for permissions
#
# =============================================================================

on:
  # Scheduled trigger - Daily at 2:00 AM UTC
  schedule:
    - cron: '0 2 * * *'

  # Manual trigger - Allows admins to run sync on-demand via GitHub UI
  workflow_dispatch:
    inputs:
      sync_type:
        description: 'Sync type to run'
        required: false
        type: choice
        default: 'all'
        options:
          - all
          - countries
          - districts
          - taxa
          - surveys
          - users

# Limit to one sync at a time to prevent conflicts
concurrency:
  group: airtable-sync
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Job: Sync All Entities from Airtable
  # ===========================================================================
  sync:
    name: Sync from Airtable
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Prevent stuck jobs

    # Environment variables for all steps
    env:
      MONGODB_VALIDATION_URI: ${{ secrets.MONGODB_VALIDATION_URI }}
      MONGODB_VALIDATION_DB: ${{ secrets.MONGODB_VALIDATION_DB }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      NODE_ENV: production
      TZ: UTC

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout Repository
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Shallow clone for speed

      # -----------------------------------------------------------------------
      # Step 2: Setup Node.js Environment
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # LTS version
          cache: 'npm'  # Cache dependencies for faster runs

      # -----------------------------------------------------------------------
      # Step 3: Install Dependencies
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci --prefer-offline --no-audit
          echo "✅ Dependencies installed successfully"

      # -----------------------------------------------------------------------
      # Step 4: Validate Environment Variables
      # -----------------------------------------------------------------------
      - name: Validate configuration
        run: |
          echo "🔍 Validating environment variables..."

          MISSING_VARS=()

          if [ -z "$MONGODB_VALIDATION_URI" ]; then
            MISSING_VARS+=("MONGODB_VALIDATION_URI")
          fi

          if [ -z "$MONGODB_VALIDATION_DB" ]; then
            MISSING_VARS+=("MONGODB_VALIDATION_DB")
          fi

          if [ -z "$AIRTABLE_BASE_ID" ]; then
            MISSING_VARS+=("AIRTABLE_BASE_ID")
          fi

          if [ -z "$AIRTABLE_TOKEN" ]; then
            MISSING_VARS+=("AIRTABLE_TOKEN")
          fi

          if [ ${#MISSING_VARS[@]} -ne 0 ]; then
            echo "❌ ERROR: Missing required environment variables:"
            printf '   - %s\n' "${MISSING_VARS[@]}"
            echo ""
            echo "💡 Add these secrets in: GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi

          echo "✅ All required environment variables are set"
          echo "📊 Using database: $MONGODB_VALIDATION_DB"

      # -----------------------------------------------------------------------
      # Step 5: Sync Countries
      # -----------------------------------------------------------------------
      # Runs first: `countries` is what gates a country appearing in the portal at all. It was
      # previously missing from this workflow, so the collection stayed frozen while surveys,
      # districts and users all tracked Airtable — which is why a newly added country never
      # showed up.
      - name: Sync Countries
        if: inputs.sync_type == 'all' || inputs.sync_type == 'countries' || inputs.sync_type == ''
        id: sync_countries
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          retry_on: error
          warning_on_retry: true
          command: |
            echo "🌍 Starting countries sync..."
            echo "⏰ Started at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo ""

            node scripts/sync_countries_from_airtable.cjs

            SYNC_EXIT_CODE=$?
            echo ""
            echo "⏰ Completed at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"

            if [ $SYNC_EXIT_CODE -eq 0 ]; then
              echo "✅ Countries sync completed successfully"
            else
              echo "❌ Countries sync failed with exit code: $SYNC_EXIT_CODE"
              exit $SYNC_EXIT_CODE
            fi
          on_retry_command: |
            echo "⚠️  Retry attempt for countries sync..."
            echo "⏳ Waiting 30 seconds before retry..."

      # -----------------------------------------------------------------------
      # Step 6: Sync Districts (GAUL Codes)
      # -----------------------------------------------------------------------
      - name: Sync Districts
        if: inputs.sync_type == 'all' || inputs.sync_type == 'districts' || inputs.sync_type == ''
        id: sync_districts
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          retry_on: error
          warning_on_retry: true
          command: |
            echo "🌍 Starting districts sync (GAUL codes)..."
            echo "⏰ Started at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo ""

            node scripts/sync_districts_from_airtable.cjs

            SYNC_EXIT_CODE=$?
            echo ""
            echo "⏰ Completed at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"

            if [ $SYNC_EXIT_CODE -eq 0 ]; then
              echo "✅ Districts sync completed successfully"
            else
              echo "❌ Districts sync failed with exit code: $SYNC_EXIT_CODE"
              exit $SYNC_EXIT_CODE
            fi
          on_retry_command: |
            echo "⚠️  Retry attempt for districts sync..."
            echo "⏳ Waiting 30 seconds before retry..."

      # -----------------------------------------------------------------------
      # Step 7: Sync Taxa (FAO species codes) — reference data for the download filter
      # -----------------------------------------------------------------------
      - name: Sync Taxa
        if: inputs.sync_type == 'all' || inputs.sync_type == 'taxa' || inputs.sync_type == ''
        id: sync_taxa
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          retry_on: error
          warning_on_retry: true
          command: |
            echo "🐟 Starting taxa sync (FAO species codes)..."
            echo "⏰ Started at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo ""

            node scripts/sync_taxa_from_airtable.cjs

            SYNC_EXIT_CODE=$?
            echo ""
            echo "⏰ Completed at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"

            if [ $SYNC_EXIT_CODE -eq 0 ]; then
              echo "✅ Taxa sync completed successfully"
            else
              echo "❌ Taxa sync failed with exit code: $SYNC_EXIT_CODE"
              exit $SYNC_EXIT_CODE
            fi
          on_retry_command: |
            echo "⚠️  Retry attempt for taxa sync..."
            echo "⏳ Waiting 30 seconds before retry..."

      # -----------------------------------------------------------------------
      # Step 8: Sync Surveys (Forms)
      # -----------------------------------------------------------------------
      - name: Sync Surveys
        if: inputs.sync_type == 'all' || inputs.sync_type == 'surveys' || inputs.sync_type == ''
        id: sync_surveys
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          retry_on: error
          warning_on_retry: true
          command: |
            echo "📋 Starting surveys sync (forms)..."
            echo "⏰ Started at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo ""

            node scripts/sync_surveys_from_airtable.js

            SYNC_EXIT_CODE=$?
            echo ""
            echo "⏰ Completed at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"

            if [ $SYNC_EXIT_CODE -eq 0 ]; then
              echo "✅ Surveys sync completed successfully"
            else
              echo "❌ Surveys sync failed with exit code: $SYNC_EXIT_CODE"
              exit $SYNC_EXIT_CODE
            fi
          on_retry_command: |
            echo "⚠️  Retry attempt for surveys sync..."
            echo "⏳ Waiting 30 seconds before retry..."

      # -----------------------------------------------------------------------
      # Step 9: Sync Users (depends on districts + surveys)
      # -----------------------------------------------------------------------
      - name: Sync Users
        if: inputs.sync_type == 'all' || inputs.sync_type == 'users' || inputs.sync_type == ''
        id: sync_users
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          retry_on: error
          warning_on_retry: true
          command: |
            echo "👥 Starting users sync (depends on districts + surveys)..."
            echo "⏰ Started at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo ""

            node scripts/sync_users_from_airtable.js

            SYNC_EXIT_CODE=$?
            echo ""
            echo "⏰ Completed at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"

            if [ $SYNC_EXIT_CODE -eq 0 ]; then
              echo "✅ Users sync completed successfully"
            else
              echo "❌ Users sync failed with exit code: $SYNC_EXIT_CODE"
              exit $SYNC_EXIT_CODE
            fi
          on_retry_command: |
            echo "⚠️  Retry attempt for users sync..."
            echo "⏳ Waiting 30 seconds before retry..."

      # -----------------------------------------------------------------------
      # Step 10: Generate Sync Summary
      # -----------------------------------------------------------------------
      - name: Generate sync summary
        if: success()
        run: |
          echo "════════════════════════════════════════════════════════════════════"
          echo "✅ SYNC COMPLETED SUCCESSFULLY"
          echo "════════════════════════════════════════════════════════════════════"
          echo ""
          echo "📅 Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "🔄 Sync Type: ${{ inputs.sync_type || 'all (scheduled)' }}"
          echo "🏃 Triggered by: ${{ github.event_name }}"
          echo ""
          echo "✅ Countries: Synced"
          echo "✅ Districts: Synced"
          echo "✅ Taxa: Synced"
          echo "✅ Surveys: Synced"
          echo "✅ Users: Synced"
          echo ""
          echo "════════════════════════════════════════════════════════════════════"

      # -----------------------------------------------------------------------
      # Step 11: Store Logs as Artifacts (for debugging)
      # -----------------------------------------------------------------------
      - name: Upload sync logs
        if: always()  # Run even if previous steps failed
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs-${{ github.run_id }}
          path: |
            *.log
            logs/*.log
          retention-days: 30
          if-no-files-found: ignore
